<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Matemática Inteligente</title>
  <style>
    * { box-sizing: border-box; }
 
    :root {
      --bg-main: #f6f8ff;
      --card-bg: rgba(255,255,255,0.9);
      --card-border: rgba(255,255,255,0.7);
      --text-main: #24324a;
      --text-soft: #60708a;
      --primary: #6c8cff;
      --primary-2: #8a6cff;
      --success: #34c38f;
      --shadow: 0 18px 45px rgba(46, 68, 120, 0.16);
    }
 
    body {
      font-family: Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
      background-color: #eef3ff;
      background-image:
        linear-gradient(rgba(108,140,255,0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,140,255,0.10) 1px, transparent 1px),
        linear-gradient(135deg, #eef3ff 0%, #f9f6ff 55%, #eef8ff 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }
 
    .card {
      background: var(--card-bg);
      padding: 36px 28px;
      border-radius: 28px;
      width: 100%;
      max-width: 760px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      animation: fadeUp 0.4s ease;
    }
 
    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
      color: #31456f;
      text-align: center;
    }
 
    .subtitle {
      margin: 0 0 28px 0;
      color: var(--text-soft);
      line-height: 1.5;
      text-align: center;
      font-size: 15px;
    }
 
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin: 24px 0 10px 0;
    }
 
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
 
    .grade-btn {
      display: block;
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(108,140,255,0.07);
      border: 1px solid rgba(108,140,255,0.18);
      color: #2e4470;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
 
    .grade-btn:hover {
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(108,140,255,0.28);
      border-color: transparent;
    }
 
    .grade-btn .grade-emoji {
      display: block;
      font-size: 26px;
      margin-bottom: 6px;
    }
 
    .divider {
      border: none;
      border-top: 1px solid rgba(108,140,255,0.12);
      margin: 24px 0 0 0;
    }
 
    .main-character-box {
      position: fixed;
      right: 24px;
      bottom: 18px;
      width: 170px;
      z-index: 999;
      pointer-events: none;
    }
 
    .main-character-img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    @media (max-width: 640px) {
      body { padding: 14px; }
      .card { padding: 20px 16px; }
      .grade-grid { grid-template-columns: 1fr 1fr; }
      .main-character-box { width: 112px; right: 10px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Evaluación Matemática</h2>
    <p class="subtitle">Selecciona el grado del alumno para comenzar el examen correspondiente.</p>
 
    <div class="section-title">Primaria</div>
    <div class="grade-grid">
      <a class="grade-btn" href="cuarto-primaria.html">
        <span class="grade-emoji">📚</span>4° Primaria
      </a>
      <a class="grade-btn" href="quinto-primaria.html">
        <span class="grade-emoji">📚</span>5° Primaria
      </a>
      <a class="grade-btn" href="sexto-primaria.html">
        <span class="grade-emoji">📚</span>6° Primaria
      </a>
    </div>
 
    <hr class="divider">
 
    <div class="section-title">Secundaria</div>
    <div class="grade-grid">
      <a class="grade-btn" href="primero-secundaria.html">
        <span class="grade-emoji">🎓</span>1° Secundaria
      </a>
      <a class="grade-btn" href="segundo-secundaria.html">
        <span class="grade-emoji">🎓</span>2° Secundaria
      </a>
      <a class="grade-btn" href="tercero-secundaria.html">
        <span class="grade-emoji">🎓</span>3° Secundaria
      </a>
      <a class="grade-btn" href="cuarto-secundaria.html">
        <span class="grade-emoji">🎓</span>4° Secundaria
      </a>
      <a class="grade-btn" href="quinto-secundaria.html">
        <span class="grade-emoji">🎓</span>5° Secundaria
      </a>
    </div>
  </div>
 
  <div class="main-character-box">
    <img class="main-character-img" src="img/personaje-neutro.png" alt="Asistente">
  </div>
</body>
</html>
